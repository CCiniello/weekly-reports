<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{REPORT_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F172A; --cobalt:#2A41A2; --peri:#6C8CFD; --peri-soft:#e7ecff;
    --ink:#212529; --muted:#5f6b7a; --line:#E9E9F4; --bg:#F6F7FA; --card:#fff;
    --good:#12915b; --good-bg:#e3f5ec; --warn:#b7791f; --warn-bg:#fbf1dd; --bad:#c23b39; --bad-bg:#fbe4e3;
    --gray:#8a93a3; --gray-bg:#eef0f5; --mono:'Roboto Mono',monospace;
  }
  /* ---- PER-PRODUCT THEME (agent sets one class on <body>) ---- */
  body.theme-reveal   {--accent:#EC417A;--accent-deep:#C9367F;--accent-soft:#fde4ee;--hero:linear-gradient(120deg,#FBB764,#EC417A 62%,#d63384)}
  body.theme-slingshot{--accent:#4B45C6;--accent-deep:#2D2A90;--accent-soft:#ECEBFB;--hero:linear-gradient(120deg,#6C5CE7,#4B45C6 55%,#2D2A90)}
  body.theme-ui       {--accent:#FF6B2C;--accent-deep:#E14E12;--accent-soft:#FFEEE2;--hero:linear-gradient(120deg,#FF9A4D,#FF6B2C 55%,#E14E12)}
  body.theme-all      {--accent:#2563EB;--accent-deep:#7C3AED;--accent-soft:#EEF1FF;--hero:linear-gradient(120deg,#2563EB,#7C3AED)}

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Roboto',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .hubnav{position:sticky;top:0;z-index:99;display:flex;align-items:center;gap:8px;background:#0B1220;color:#fff;font-weight:600;font-size:13px;padding:11px 20px;text-decoration:none}
  .hubnav:hover{background:#111a2e}
  .hubnav svg{width:14px;height:14px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 22px 80px}

  header.top{background:var(--hero);color:#fff;border-radius:16px 16px 0 0;padding:22px 26px 20px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.30),transparent 70%)}
  .logochip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:9px;padding:7px 13px;margin-bottom:12px;box-shadow:0 3px 12px rgba(0,0,0,.14);font-weight:900;font-size:16px;color:var(--accent);letter-spacing:-.01em}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92);font-weight:600}
  header.top h1{margin:5px 0 0;font-size:26px;font-weight:900}
  .meta{margin-top:13px;display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.85)}
  .meta b{color:#fff;font-weight:700}

  .tabbar{background:#fff;border:1px solid var(--line);border-top:none;display:flex;align-items:center;gap:2px;padding:0 12px;position:sticky;top:42px;z-index:5;box-shadow:0 2px 10px rgba(15,23,42,.03)}
  .tab{appearance:none;background:none;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:15px 18px 13px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px}
  .tab .cbadge{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--gray-bg);color:var(--muted);border-radius:999px;padding:1px 8px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent-deep);border-bottom-color:var(--accent)}
  .tab.on .cbadge{background:var(--accent-soft);color:var(--accent-deep)}

  .panel{display:none;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;padding:24px 26px 30px}
  .panel.on{display:block}

  .slink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-deep));padding:9px 15px;border-radius:9px;white-space:nowrap;text-decoration:none}
  .slink:hover{filter:brightness(1.05)}
  .slink svg{width:13px;height:13px}

  /* ===== TASKS (scoped) ===== */
  #tasks .taskhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  #tasks .viewtoggle{display:inline-flex;background:var(--gray-bg);border-radius:10px;padding:3px}
  #tasks .vbtn{appearance:none;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:8px}
  #tasks .vbtn.on{background:#fff;color:var(--accent-deep);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  #tasks .tsum{font-size:12.5px;color:var(--muted)} #tasks .tsum b{color:var(--navy)}
  #tasks .push{margin-left:auto}
  #tasks .view{display:none} #tasks .view.on{display:block}
  #tasks .tablewrap{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  #tasks table{width:100%;border-collapse:collapse;font-size:13px}
  #tasks thead th{background:#eef2fa;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:#41506b;font-weight:600;padding:10px 13px;text-align:left;border-bottom:1px solid #dce3f0}
  #tasks tbody td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
  #tasks tbody tr:last-child td{border-bottom:none}
  #tasks tbody tr:hover{background:#fafbff}
  #tasks .tname{font-weight:600;color:var(--navy)}
  #tasks .who{display:inline-flex;align-items:center;gap:7px}
  #tasks .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;font-family:var(--mono)}
  #tasks .pri{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em}
  #tasks .P1{background:var(--bad-bg);color:var(--bad)} #tasks .P2{background:var(--warn-bg);color:var(--warn)} #tasks .P3{background:var(--gray-bg);color:var(--gray)}
  #tasks .stat{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
  #tasks .stat::before{content:"";width:6px;height:6px;border-radius:50%}
  #tasks .todo{background:var(--gray-bg);color:#566} #tasks .todo::before{background:var(--gray)}
  #tasks .prog{background:var(--peri-soft);color:var(--cobalt)} #tasks .prog::before{background:var(--cobalt)}
  #tasks .done{background:var(--good-bg);color:var(--good)} #tasks .done::before{background:var(--good)}
  #tasks .review{background:#e7ecff;color:#3E5BD0} #tasks .review::before{background:#6C8CFD}
  #tasks .deferred{background:#fbf1dd;color:#8a6412} #tasks .deferred::before{background:#b7791f}
  #tasks .blocked{background:#fbe4e3;color:#c23b39} #tasks .blocked::before{background:#c23b39}
  #tasks .stat[title]{cursor:help}
  #tasks .whymark{font-size:10px;opacity:.7}
  #tasks td.due{font-family:var(--mono);font-size:12px;color:var(--muted)}
  #tasks .donedate{font-family:var(--mono);font-size:11px;color:var(--good);white-space:nowrap}
  #tasks .donedate::before{content:"\2713 "}
  #tasks .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
  @media(max-width:820px){#tasks .board{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){#tasks .board{grid-template-columns:1fr}}
  #tasks .col{background:#f7f8fc;border:1px solid var(--line);border-radius:14px;padding:12px}
  #tasks .col-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin-bottom:11px;padding:0 4px}
  #tasks .col-h .cc{font-family:var(--mono);font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
  #tasks .col-h .dt{width:8px;height:8px;border-radius:50%}
  #tasks .tcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  #tasks .tcard .tt{font-weight:600;font-size:13px;color:var(--navy);line-height:1.35}
  #tasks .tcard .tm{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  #tasks .tcard .plt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  #tasks .tl{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fcfdff;overflow-x:auto}
  #tasks .tlrow{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  #tasks .tlrow:last-child{border-bottom:none}
  #tasks .tlname{font-size:12.5px;font-weight:600;color:var(--navy)} #tasks .tlname .sub{font-size:10.5px;color:var(--muted);font-weight:400}
  #tasks .tltrack{position:relative;height:26px;background:#f1f4fb;border-radius:7px}
  #tasks .bar{position:absolute;top:4px;height:18px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;color:#fff;font-family:var(--mono);white-space:nowrap;background:var(--accent-deep)}
  #tasks .empty{font-size:13px;color:var(--muted);padding:30px;text-align:center}

  /* ===== SUMMARY (scoped) ===== */
  #summary .sumhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  #summary .dtitle{font-size:13px;font-weight:700;color:var(--navy)}
  #summary .push{margin-left:auto;border:none;cursor:pointer;font-family:inherit}
  #summary .copied{background:var(--good)!important;filter:none!important}
  #summary .summary-card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:22px 24px;background:#fff;font-size:14.5px;line-height:1.6;color:var(--ink)}
  #summary .summary-card h1,#summary .summary-card h2,#summary .summary-card h3{color:var(--navy);font-weight:900;margin:0 0 10px}
  #summary .summary-card h2{font-size:18px} #summary .summary-card h3{font-size:15px;margin-top:16px}
  #summary .summary-card p{margin:0 0 12px} #summary .summary-card b,#summary .summary-card strong{color:var(--navy)}
  #summary .summary-card ul{margin:0 0 12px;padding-left:20px} #summary .summary-card li{margin-bottom:6px}
</style>
</head>
<!-- AGENT: set the theme class → theme-reveal | theme-slingshot | theme-ui | theme-all -->
<body class="{{THEME}}">
<a class="hubnav" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg> All Reports</a>
<div class="wrap">

  <header class="top">
    <div class="logochip">{{PRODUCT_NAME}}</div>
    <div class="kick">{{PRODUCT_KICKER}}</div>
    <h1>{{REPORT_TITLE}}</h1>
    <div class="meta">{{REPORT_META}}</div>
  </header>

  <div class="tabbar">
    <button class="tab on" data-tab="report">Report</button>
    <button class="tab" data-tab="tasks">Tasks <span class="cbadge" id="taskCount">0</span></button>
    <button class="tab" data-tab="summary">Summary</button>
  </div>

  <!-- REPORT: agent injects its full analysis HTML here -->
  <section class="panel on" id="report">
    {{REPORT_BODY}}
  </section>

  <!-- TASKS: rendered by JS from the TASKS array below -->
  <section class="panel" id="tasks">
    <div class="taskhead">
      <div class="viewtoggle">
        <button class="vbtn on" data-view="table">Table</button>
        <button class="vbtn" data-view="board">Board</button>
        <button class="vbtn" data-view="timeline">Timeline</button>
      </div>
      <span class="tsum" id="taskSummary"></span>
      <a class="slink push" href="{{SLINGSHOT_TASKS_URL}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg> Open this list in Slingshot</a>
    </div>
    <div class="view on" data-view="table"><div class="tablewrap"><table><thead><tr><th>Task</th><th>Channel</th><th>Owner</th><th>Priority</th><th>Status</th><th>Due</th></tr></thead><tbody id="tblBody"></tbody></table></div></div>
    <div class="view" data-view="board"><div class="board" id="boardWrap"></div></div>
    <div class="view" data-view="timeline"><div class="tl" id="tlWrap"></div></div>
  </section>

  <!-- SUMMARY: the exec summary, formatted, with a Copy button -->
  <section class="panel" id="summary">
    <div class="sumhead"><span class="dtitle">Executive summary</span><button class="slink push" id="copyBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> <span id="copyLabel">Copy summary</span></button></div>
    <div class="summary-card" id="summaryCard">
      {{SUMMARY_HTML}}
    </div>
  </section>

</div>

<script>
  /* ============================================================
     Tasks are a LIVE snapshot of the Slingshot list (PARENT tasks only).
     status / due / completed / deferred come straight from Slingshot — never hand-assigned.
     TASK shape: {name, channel, owner, initials, color, priority:"P1|P2|P3",
       status:"todo|prog|review|deferred|blocked|done", due:"YYYY-MM-DD",
       start?, completed?:"YYYY-MM-DD" (date completed), deferred?:"<Deferred Reason text>",
       lever?, result?}
     ============================================================ */
  const TASKS = {{TASKS_JSON}};

  var accentDeep = getComputedStyle(document.body).getPropertyValue('--accent-deep').trim() || '#333';
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  /* Slingshot dates are date-only YYYY-MM-DD; parse as LOCAL midnight so they never shift a day
     (new Date("YYYY-MM-DD") parses as UTC and renders as the prior day in negative-offset zones). */
  function localDate(iso){ var p=String(iso).split('-'); return new Date(+p[0], (+p[1])-1, +p[2]); }
  var STAT={todo:'To do',prog:'In progress',review:'In review',deferred:'Deferred',blocked:'Blocked',done:'Done'};

  // counts + summary
  document.getElementById('taskCount').textContent = TASKS.length;
  var prog = TASKS.filter(function(t){return t.status==='prog';}).length;
  var review = TASKS.filter(function(t){return t.status==='review';}).length;
  var deferred = TASKS.filter(function(t){return t.status==='deferred';}).length;
  var done = TASKS.filter(function(t){return t.status==='done';}).length;
  var bits=[]; if(prog)bits.push('<b>'+prog+'</b> in progress'); if(review)bits.push('<b>'+review+'</b> in review'); if(deferred)bits.push('<b>'+deferred+'</b> deferred'); if(done)bits.push('<b>'+done+'</b> done');
  document.getElementById('taskSummary').innerHTML = '<b>'+TASKS.length+' tasks</b> · live from Slingshot · '+bits.join(' · ');

  // TABLE
  document.getElementById('tblBody').innerHTML = TASKS.length ? TASKS.map(function(t){
    return '<tr><td class="tname">'+esc(t.name)+'</td><td>'+esc(t.channel||'')+'</td>'+
      '<td><span class="who"><span class="av" style="background:'+(t.color||accentDeep)+'">'+esc(t.initials||'')+'</span> '+esc(t.owner||'')+'</span></td>'+
      '<td><span class="pri '+t.priority+'">'+esc(t.priority)+'</span></td>'+
      '<td><span class="stat '+t.status+'"'+(t.deferred?' title="'+esc(t.deferred)+'"':'')+'>'+STAT[t.status]+(t.deferred?' <span class="whymark">&#9432;</span>':'')+'</span>'+(t.completed?' <span class="donedate">'+esc(t.completed)+'</span>':'')+'</td>'+
      '<td class="due">'+esc(t.due||'')+'</td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">No tasks yet for this report.</td></tr>';

  // BOARD
  function col(key,label,dot){
    var items = TASKS.filter(function(t){return t.status===key;});
    return '<div class="col"><div class="col-h"><span class="dt" style="background:'+dot+'"></span> '+label+' <span class="cc">'+items.length+'</span></div>'+
      items.map(function(t){return '<div class="tcard"><div class="tt">'+esc(t.name)+'</div><div class="tm"><span class="plt">'+esc(t.channel||'')+(t.completed?' · <span class="donedate">'+esc(t.completed)+'</span>':'')+'</span><span class="pri '+t.priority+'">'+esc(t.priority)+'</span></div></div>';}).join('')+'</div>';
  }
  var STATUS_COLS=[['todo','To do','#8a93a3'],['prog','In progress','#2A41A2'],['review','In review','#6C8CFD'],['deferred','Deferred','#b7791f'],['done','Done','#12915b']];
  document.getElementById('boardWrap').innerHTML = STATUS_COLS.filter(function(c){return TASKS.some(function(t){return t.status===c[0];});}).map(function(c){return col(c[0],c[1],c[2]);}).join('');

  // TIMELINE
  (function(){
    var wrap=document.getElementById('tlWrap');
    var withDue = TASKS.filter(function(t){return t.due;});
    if(!withDue.length){ wrap.innerHTML='<div class="empty">No dated tasks to plot.</div>'; return; }
    var starts = withDue.map(function(t){return localDate(t.start||t.due).getTime();});
    var ends = withDue.map(function(t){return localDate(t.due).getTime();});
    var min=Math.min.apply(null,starts), max=Math.max.apply(null,ends), span=Math.max(1,max-min);
    wrap.innerHTML = withDue.map(function(t){
      var s=localDate(t.start||t.due).getTime(), e=localDate(t.due).getTime();
      var left=((s-min)/span*100), width=Math.max(7,(e-s)/span*100);
      if(left+width>100){width=100-left;}
      return '<div class="tlrow"><div class="tlname">'+esc(t.name)+'<div class="sub">'+esc(t.owner||'')+' · '+esc(t.priority)+'</div></div>'+
        '<div class="tltrack"><div class="bar" style="left:'+left+'%;width:'+width+'%">'+esc(t.due)+'</div></div></div>';
    }).join('');
  })();

  // COPY SUMMARY — copies rich HTML + a plain-text fallback, so it pastes
  // cleanly into Slingshot, email, docs, anywhere.
  var copyBtn=document.getElementById('copyBtn'), copyLabel=document.getElementById('copyLabel'), card=document.getElementById('summaryCard');
  copyBtn.addEventListener('click',function(){
    var html=card.innerHTML.trim(), text=card.innerText.trim();
    function done(){ copyBtn.classList.add('copied'); copyLabel.textContent='Copied!'; setTimeout(function(){copyBtn.classList.remove('copied');copyLabel.textContent='Copy summary';},1800); }
    if(navigator.clipboard && window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]).then(done).catch(function(){ navigator.clipboard.writeText(text).then(done); });
    } else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(done); }
    else { var r=document.createRange(); r.selectNode(card); var s=getSelection(); s.removeAllRanges(); s.addRange(r); try{document.execCommand('copy');done();}catch(e){} s.removeAllRanges(); }
  });

  // TABS + VIEW TOGGLE
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
    t.classList.add('on'); document.getElementById(t.dataset.tab).classList.add('on');
    window.scrollTo({top:0,behavior:'smooth'});
  });});
  document.querySelectorAll('.vbtn').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('.vbtn').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('#tasks .view').forEach(function(v){v.classList.remove('on');});
    b.classList.add('on'); document.querySelector('#tasks .view[data-view="'+b.dataset.view+'"]').classList.add('on');
  });});
</script>
</body>
</html>
